# Chunky — Streamlit teması ve sunucu ayarları
# Renkler docs/images/ui-mockup-v1.png ile aynı: açık zemin, koyu turkuaz vurgu, açık gri-mavi ikincil alanlar.

[theme]
base = "light"
primaryColor = "#1F6F8B"          # koyu turkuaz — butonlar, kaydırıcılar, odak çerçevesi (mockup)
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F3F6F9"   # kenar çubuğu, sohbet kutusu ve balonlar, açık gri-mavi (mockup)
textColor = "#1F2933"
font = "sans serif"

[server]
headless = true
runOnSave = false
maxUploadSize = 5

[browser]
gatherUsageStats = false

[client]
toolbarMode = "viewer"        # sağ üstteki Deploy düğmesini gizle (demo ekranı); kalan menü app.py'de CSS ile gizlenir
