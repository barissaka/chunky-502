[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chunky"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ipykernel",
    "nbstripout",
    "python-docx==1.2.0",
    "pyyaml==6.0.3",
    "openpyxl==3.1.5",
    "numpy==2.5.4",
    "torch==2.15.0",
    "transformers==5.23.0",
    "huggingface-hub==2.4.0",
]

[tool.setuptools.packages.find]
where = ["src"]